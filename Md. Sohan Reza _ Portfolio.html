/* ===== EDIT HERE: colours, fonts, shape ===== */
:root{
  --bg:#e9ecef;        /* page background      */
  --bg2:#ffffff;      /* panels / surfaces    */
  --ink:#14171c;      /* body text            */
  --muted:#64748b;  /* secondary text       */
  --p:#94a3b8;          /* primary              */
  --s:#1f2937;          /* secondary            */
  --a:#e8422f;          /* accent (links, CTAs) */
  --line:color-mix(in srgb, #14171c 16%, transparent);
  --card-bg:#ffffff;
  --card-shadow:0 10px 30px -10px rgba(0,0,0,0.07);
  --fh:'Sora',sans-serif;   /* headings */
  --fb:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;   /* body text */
  --fm:'IBM Plex Mono',ui-monospace,monospace; /* accents */
  --hw:700;
  --bw:400;
  --hls:-0.01em;
  --rad:999px;
}

[data-theme="dark"]{
  --bg:#0f172a;        /* sleek dark navy slate */
  --bg2:#1e293b;       /* panel / card background */
  --ink:#f8fafc;       /* crisp white text */
  --muted:#94a3b8;     /* clean secondary text */
  --p:#334155;
  --s:#0f172a;
  --a:#ff5733;         /* vibrant energetic accent */
  --line:rgba(255,255,255,0.1);
  --card-bg:#1e293b;
  --card-shadow:0 12px 36px -10px rgba(0,0,0,0.45);
}
/* ===== end EDIT HERE ===== */

*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:var(--bw);
font-size:16px;line-height:1.65;overflow-x:hidden;position:relative;min-height:100vh;transition:background-color .35s ease,color .35s ease}
canvas#bg,#bgw{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--fh);font-weight:var(--hw);line-height:1.05;letter-spacing:var(--hls)}
::selection{background:var(--a);color:var(--bg)}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.wrap{width:min(1240px,calc(100% - clamp(28px,7vw,120px)));margin-inline:auto;position:relative}
main,header,footer,nav{position:relative;z-index:10}

.theme-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg2);color:var(--ink);
  cursor:pointer;font-size:18px;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--card-shadow);
}
.theme-toggle:hover{
  border-color:var(--a);color:var(--a);transform:rotate(15deg) scale(1.05);
}
.nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(18px,4vw,54px);
  z-index:90;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{font-family:var(--fh);font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.nav .links{display:flex;align-items:center;gap:24px}
.nav .links a{font-size:13px;letter-spacing:.08em;font-weight:500;color:var(--ink);position:relative;transition:color .3s}
.nav .links a:after{content:'';position:absolute;left:0;bottom:-4px;width:100%;height:1.5px;background:var(--a);transform:scaleX(0);transform-origin:right;transition:transform .3s ease}
.nav .links a:hover:after{transform:scaleX(1);transform-origin:left}
.nav .links a:hover{color:var(--a)}
.navcta{border:1px solid color-mix(in srgb, var(--a) 40%, transparent);background:color-mix(in srgb, var(--a) 10%, transparent);color:var(--a);padding:8px 18px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:all .3s}
.navcta:hover{background:var(--a);color:var(--bg);box-shadow:0 8px 20px -8px var(--a)}

.sec{padding:clamp(60px,10vw,130px) 0;position:relative}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 24px;margin-bottom:clamp(28px,5vw,50px)}
.sechead h2{font-size:clamp(28px,5vw,60px)}

.eyebrow{font-family:var(--fb);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--a);
display:inline-flex;align-items:center;gap:9px}
.eyebrow:before{content:'';width:26px;height:1px;background:currentColor;display:inline-block}
.hero{position:relative;overflow:hidden;padding-top:80px}
.hero-in{position:relative;display:grid;grid-template-columns:1.2fr 0.9fr;gap:clamp(30px,4vw,60px);align-items:center;min-height:calc(100svh - 80px);padding:40px 0 60px}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;text-align:left;position:relative;z-index:2}
.hero-right{position:relative;display:flex;justify-content:center;align-items:center;z-index:2}

.hero-img-card{
  position:relative;
  width:100%;
  max-width:440px;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 24px 50px -12px color-mix(in srgb, var(--ink) 25%, transparent), 0 0 0 1px var(--line);
  background:linear-gradient(145deg, #ffffff, color-mix(in srgb, var(--p) 20%, #ffffff));
  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
}
.hero-img-card:hover{
  transform:translateY(-6px);
  box-shadow:0 30px 60px -15px color-mix(in srgb, var(--a) 30%, transparent), 0 0 0 1px var(--a);
}
.hero-img-card img{
  width:100%;
  height:auto;
  object-fit:cover;
  display:block;
  aspect-ratio:4/4.8;
}
.hero-img-card .badge{
  position:absolute;
  bottom:16px;
  left:16px;
  right:16px;
  padding:12px 18px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  background:color-mix(in srgb, var(--bg2) 85%, transparent);
  border-radius:18px;
  border:1px solid color-mix(in srgb, var(--line) 40%, transparent);
  display:flex;
  align-items:center;
  gap:12px;
}
.hero-img-card .badge-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 12px #10b981;
  animation:blink 1.4s infinite;
}
.hero-img-card .badge-text{
  font-family:var(--fb);
  font-size:12px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.05em;
  line-height:1.2;
}

.htitle{
  font-size:clamp(36px, 5.2vw, 68px);
  line-height:1.08;
  letter-spacing:-0.02em;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:800;
  word-break:break-word;
}
.htitle span{display:inline-block;transform:translateY(110%);opacity:0}
.htitle .sp{width:.28em}
body.go .htitle span{animation:hin .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes hin{to{transform:translateY(0);opacity:1}}

.hero-left>.eyebrow, .hero-left>.hrole, .hero-left>.htag, .hero-left>.hcta, .hero-left>.hmeta{
  opacity:0;
  transform:translateY(20px);
}
body.go .hero-left>.eyebrow, body.go .hero-left>.hrole, body.go .hero-left>.htag,
body.go .hero-left>.hcta, body.go .hero-left>.hmeta, body.go .hero-right{
  animation:hup .9s .5s cubic-bezier(.16,1,.3,1) forwards;
}
.hero-right{opacity:0;transform:translateY(30px)}
@keyframes hup{to{opacity:1;transform:none}}

.hrole{
  margin-top:10px;
  font-size:clamp(13px, 1.4vw, 17px);
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--a);
  font-weight:600;
}
.htag{
  max-width:52ch;
  margin-top:14px;
  font-size:clamp(14px, 1.2vw, 17px);
  color:color-mix(in srgb, var(--ink) 80%, var(--bg));
  line-height:1.65;
}
.hcta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:var(--rad);
background:var(--a);color:var(--bg);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
border:1px solid var(--a);transition:transform .3s,background .3s,color .3s,box-shadow .3s;font-family:var(--fb)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 34px -14px var(--a)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--a);color:var(--a)}

.hmeta{display:flex;flex-wrap:wrap;gap:clamp(16px,2.5vw,36px);margin-top:36px}
.hmeta div{display:grid;gap:3px}
.hmeta b{font-family:var(--fh);font-size:clamp(20px,2.4vw,30px);font-weight:var(--hw);line-height:1;color:var(--a)}
.hmeta span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.hcircle{position:absolute;right:-10%;top:30%;width:min(60vmin,500px);aspect-ratio:1;transform:translate(0,-50%);
border:1px solid color-mix(in srgb,var(--p) 35%,transparent);border-radius:50%;pointer-events:none;animation:spinslow 34s linear infinite}
.hcircle:after{content:'';position:absolute;inset:14%;border:1px dashed color-mix(in srgb,var(--a) 25%,transparent);border-radius:50%}
@keyframes spinslow{to{transform:translate(0,-50%) rotate(360deg)}}

@media(max-width:960px){
  .hero{padding-top:80px}
  .hero-in{grid-template-columns:1fr;gap:36px;text-align:center;padding:20px 0 50px}
  .hero-left{align-items:center;text-align:center}
  .htag{margin-left:auto;margin-right:auto}
  .hcta{justify-content:center}
  .hmeta{justify-content:center}
  .hero-right{order:-1;margin-top:10px}
  .hero-img-card{max-width:320px}
  .hcircle{display:none}
}

@media(max-width:680px){
  .nav{padding:12px 18px}
  .nav .links{display:none} /* Clean, clutter-free mobile view */
  .brand{font-size:16px}
  .navcta{padding:6px 14px;font-size:11px}
  .htitle{font-size:clamp(30px, 9vw, 44px);letter-spacing:-0.01em}
  .hrole{font-size:12px;letter-spacing:.18em}
  .hero-img-card{max-width:260px;border-radius:22px}
  .hero-img-card .badge{padding:8px 12px;bottom:10px;left:10px;right:10px;border-radius:12px}
  .hero-img-card .badge-text{font-size:10px}
  .hmeta{gap:18px}
  .hmeta div{text-align:center}
  .sk{grid-template-columns:1fr auto;gap:10px}
  .sk:before{display:none}
  .skn{font-size:16px}
  .cmail{font-size:clamp(20px, 6vw, 32px)}
}

.rv{opacity:0;filter:blur(4px);transform:translateY(16px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),filter .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;filter:blur(0);transform:none}

.o-cube{perspective:900px}
.cb{position:relative;width:150px;height:150px;transform-style:preserve-3d;animation:cbspin 18s linear infinite}
.cb i{position:absolute;inset:0;border:1px solid var(--a);background:color-mix(in srgb,var(--p) 16%,transparent)}
.cb i:nth-child(1){transform:translateZ(75px)}.cb i:nth-child(2){transform:rotateY(180deg) translateZ(75px)}
.cb i:nth-child(3){transform:rotateY(90deg) translateZ(75px)}.cb i:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}
.cb i:nth-child(5){transform:rotateX(90deg) translateZ(75px)}.cb i:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
@keyframes cbspin{to{transform:rotateX(360deg) rotateY(720deg)}}

.social-youtube svg{color:#ff0000}

footer{border-top:1px solid var(--line);padding:32px 0;font-size:12.5px;color:var(--muted);position:relative;z-index:10;background:var(--bg);transition:background-color .35s,border-color .35s}
.foot{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;letter-spacing:.08em;font-family:var(--fb)}
.dev-credit{display:inline-flex;align-items:center;font-size:13px}
.dev-link{
  color:#2563eb;
  font-weight:700;
  text-decoration:none;
  padding:2px 4px;
  border-radius:4px;
  transition:all .25s ease;
}
.dev-link:hover{
  color:#1d4ed8;
  text-decoration:underline;
  background:rgba(37,99,235,0.08);
}
[data-theme="dark"] .dev-link{
  color:#60a5fa;
}
[data-theme="dark"] .dev-link:hover{
  color:#93c5fd;
  background:rgba(96,165,250,0.12);
}

#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--a);z-index:100;transition:width .1s linear}
#ld{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center;align-content:center;transition:opacity .7s ease,visibility .7s}
#ld.out{opacity:0;visibility:hidden}
#c1,#c2{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;display:grid;place-items:center;will-change:transform;transform:translate3d(-100px,-100px,0)}
#c1{width:0;height:0;border-left:9px solid var(--a);border-top:6px solid transparent;border-bottom:6px solid transparent}
#c2{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--a) 22%,transparent);transition:.3s cubic-bezier(.2,.8,.2,1)}
body.cur-on #c2{width:70px;height:70px;background:color-mix(in srgb,var(--a) 30%,transparent)}
@media(pointer:fine){body{cursor:none}a,button,.theme-toggle{cursor:none}}
@media(pointer:coarse){#c1,#c2{display:none!important}}

.sec+.sec:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);
transform:scaleX(0);transform-origin:left;transition:transform 1.2s cubic-bezier(.76,0,.24,1)}
.sec.seen:before{transform:scaleX(1)}


.ldc{font-family:var(--fh);font-size:clamp(80px,22vw,220px);line-height:1;color:var(--a)}
.ldc.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}



.pj:hover .pjn,.pj:hover .pjl,.pj:hover .pjt,.pj:hover .pjd{color:var(--bg)}
.pjl{line-height:1.5}

.o-dial{perspective:900px}
.dl{position:relative;width:230px;height:230px;transform-style:preserve-3d}
.dl b{position:absolute;inset:0;border:1.5px solid var(--a);border-radius:50%;animation:ring 3.6s ease-out infinite;opacity:0}
.dl b:nth-child(2){animation-delay:-1.2s}.dl b:nth-child(3){animation-delay:-2.4s}
@keyframes ring{0%{transform:translateZ(-60px) scale(.45);opacity:.8}100%{transform:translateZ(60px) scale(1.7);opacity:0}}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--fh);font-size:54px;font-weight:800;line-height:1;color:var(--a);transform:translateZ(30px)}
.dc small{font:500 12px var(--fb);letter-spacing:.4em;color:var(--ink);margin-top:6px}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:14px;justify-content:center}
.eq i{width:4px;background:var(--ink);border-radius:2px;animation:eqb 1.3s ease-in-out infinite}
.eq i:nth-child(2n){animation-delay:-.3s}.eq i:nth-child(3n){animation-delay:-.7s}.eq i:nth-child(4n){animation-delay:-1s}
@keyframes eqb{0%,100%{height:20%}50%{height:100%}}
#hey:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--a);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
</style>
</head>
<body class="lay-centered rev-blurin th-space-station" id="top">

<div id="ld"><div class="ldc" id="ldcd">3</div></div>
<div id="prog"></div>
<div id="c1"></div><div id="c2"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="tex" aria-hidden="true"></div>


<nav class="nav"><a class="brand" href="#top" id="brand">·</a><div class="links"><a href="#about">Profile</a><a href="#skills">Impact</a><a href="#projects">Work</a><a href="#experience">Rajshahi</a><a href="#contact">Contact</a></div>
<div style="display:flex;align-items:center;gap:12px;">
  <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode" aria-label="Toggle Dark Mode">🌙</button>
  <a class="navcta" href="#contact">Say hello</a>
</div></nav>

<header class="hero">
  <div class="wrap hero-in">
    <div class="hero-left">
      <span class="eyebrow" id="hey"></span>
      <h1 class="htitle" id="hname"></h1>
      <p class="hrole" id="hrole"></p>
      <p class="htag" id="htag"></p>
      <div class="hcta"><a class="btn" href="#projects" id="cta1"></a><a class="btn ghost" href="#contact" id="cta2"></a></div>
      <div class="hmeta" id="hmeta"></div>
    </div>
    <div class="hero-right">
      <div class="hero-img-card">
        <img src="sohanreza.png" alt="Md. Sohan Reza" width="440" height="528" loading="eager">
        <div class="badge">
          <span class="badge-dot"></span>
          <span class="badge-text">Radio Padma 99.2 FM · On Air & Mentoring</span>
        </div>
      </div>
    </div>
    <div class="hcircle" aria-hidden="true"></div>
  </div>
</header>

<main>
<section class="sec" id="about">
  <div class="wrap">
    <div class="sechead rv"><span class="eyebrow">01 — Profile</span><h2>Who I am</h2></div>
    <div class="abt"><div class="abtxt rv" id="abouttxt"></div><aside class="abmeta rv" id="aboutmeta"></aside></div>
  </div>
</section>

<section class="sec" id="skills">
  <div class="wrap">
    <div class="sechead rv"><span class="eyebrow">02 — Impact</span><h2>Evidence at a glance</h2></div>
    <div class="skills" id="skillsList"></div>
  </div>
</section>

<section class="sec" id="projects">
  <div class="wrap">
    <div class="sechead rv"><span class="eyebrow">03 — Work</span><h2>Four areas of work</h2></div>
    <div class="projects" id="projList"></div>
  </div>
</section>

<section class="sec" id="experience">
  <div class="wrap">
    <div class="sechead rv"><span class="eyebrow">04 — Rajshahi</span><h2>Five institutions, one city</h2></div>
    <div class="exp" id="exp"></div>
  </div>
</section>

<section class="sec" id="contact">
  <div class="wrap">
    <div class="sechead rv"><span class="eyebrow">05 — Contact</span><h2>Let's talk</h2></div>
    <div class="cta-wrap">
      <p class="rv" id="cline"></p>
      <a class="cmail rv" id="cmail" href="#"></a>
      <div class="socials rv" id="socials"></div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap foot">
    <span>&copy; <span id="fyear"></span> <span id="fname"></span> · <span id="floc"></span></span>
    <div class="dev-credit">
      <span>Developed by <a href="https://www.facebook.com/mjtnmy/" target="_blank" rel="noopener noreferrer" class="dev-link">Ali Tonmoy</a></span>
    </div>
  </div>
</footer>

<script>
(function(){

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const C=window.CONFIG||CONFIG;
/* ---- render content ---- */
$('#brand').textContent=C.name;
document.title=C.name+' — '+C.role;
$('#hey').textContent=C.eyebrow;
$('#hname').innerHTML=C.name.split('').map(ch=>ch===' '?'<span class="sp"></span>':'<span>'+ch+'</span>').join('');
$$('#hname span').forEach((s,i)=>s.style.animationDelay=(.35+i*.045)+'s');
$('#hrole').textContent=C.role;
$('#htag').textContent=C.tagline;
$('#cta1').textContent=C.cta1;$('#cta2').textContent=C.cta2;
$('#hmeta').innerHTML=C.meta.map(m=>'<div><b class="stat-num" data-val="'+m[0]+'">'+m[0]+'</b><span>'+m[1]+'</span></div>').join('');
$('#abouttxt').innerHTML=C.about.map(p=>'<p>'+p+'</p>').join('');
$('#aboutmeta').innerHTML=C.aboutMeta.map(m=>'<div><span>'+m[0]+'</span><span>'+m[1]+'</span></div>').join('');
$('#skillsList').innerHTML=C.skills.map(s=>'<div class="sk rv"><span class="skn">'+s.name+'</span>'+
'<span class="skv stat-num" data-val="'+s.value+'">'+s.value+'</span></div>').join('');
$('#projList').innerHTML=C.projects.map((p,i)=>'<article class="pj rv"><span class="pjn">'+String(i+1).padStart(2,'0')+'</span>'+
'<h3>'+p.title+'</h3><p class="pjt">'+p.tag+'</p><p class="pjd">'+p.desc+'</p>'+
'<span class="pjl">'+p.proof+'</span></article>').join('');
$('#exp').innerHTML=C.experience.map(e=>'<div class="ex rv"><span class="exy">'+e.year+'</span>'+
'<h4>'+e.role+'</h4><span class="exc">'+e.company+'</span><p>'+e.desc+'</p></div>').join('');
$('#cline').textContent=C.contactLine;
$('#cmail').textContent=C.email;$('#cmail').href='mailto:'+C.email;$('#cmail').target='_blank';$('#cmail').rel='noopener noreferrer';

function animNum(el){
  const raw=el.getAttribute('data-val')||el.textContent;
  const num=parseInt(raw.replace(/[^0-9]/g,''),10);
  if(isNaN(num))return;
  const hasPlus=raw.includes('+'), hasPercent=raw.includes('%'), hasComma=raw.includes(',');
  let current=0, step=Math.max(1,Math.floor(num/35)), duration=1000, ivTime=duration/35;
  const timer=setInterval(()=>{
    current+=step;
    if(current>=num){
      current=num;
      clearInterval(timer);
    }
    let formatted=hasComma?current.toLocaleString():String(current);
    el.textContent=formatted+(hasPlus?'+':'')+(hasPercent?'%':'');
  },ivTime);
}
const icons = {
  Email: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>',
  Facebook: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:8px"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
  YouTube: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="margin-right:8px"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
};

const socialLinks = [
  ["Email", "mailto:" + C.email, icons.Email, "social-email"],
  ["Facebook", "https://www.facebook.com/sohanreza.rp", icons.Facebook, "social-facebook"],
  ["YouTube", "https://www.youtube.com/@sohanrezaswindow", icons.YouTube, "social-youtube"]
];
$('#socials').innerHTML = socialLinks.map(s => '<a class="' + s[3] + '" href="' + s[1] + '" target="_blank" rel="noopener noreferrer">' + (s[2] || '') + '<span>' + s[0] + '</span></a>').join('');
$('#fname').textContent=C.name;$('#fyear').textContent=new Date().getFullYear();
$('#floc').textContent=C.location;
const mq=$('#mqtrack');if(mq){const w=[C.role,'\u2022',C.name,'\u2022','Available','\u2022'];
mq.innerHTML=Array.from({length:8},(_,i)=>'<b>'+w[i%w.length]+'</b>').join('')+
Array.from({length:8},(_,i)=>'<b>'+w[i%w.length]+'</b>').join('');}
/* ---- loader ---- */
let done=false;
function DONE(){if(done)return;done=true;const l=$('#ld');l.classList.add('out');
document.body.classList.add('go');setTimeout(()=>l.remove(),800);}
setTimeout(DONE,6000);

const el=document.getElementById('ldcd');let fq=88;el.textContent='88.0';
const iv=setInterval(()=>{fq+=.4;if(fq>=99.2){clearInterval(iv);el.textContent='99.2';setTimeout(DONE,500);return;}el.textContent=fq.toFixed(1);},55);

/* ---- cursor tracking ---- */
const c1 = $('#c1'), c2 = $('#c2');
if(c1 && c2){
  let cx = innerWidth/2, cy = innerHeight/2, tx = cx, ty = cy;
  addEventListener('mousemove', e => {
    tx = e.clientX;
    ty = e.clientY;
    c1.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) translate(-50%,-50%)';
  });
  (function lp(){
    cx += (tx - cx) * 0.14;
    cy += (ty - cy) * 0.14;
    c2.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0) translate(-50%,-50%)';
    requestAnimationFrame(lp);
  })();
  document.querySelectorAll('a, button, .theme-toggle, .pj, .sk').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cur-on'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cur-on'));
  });
}

/* ---- theme toggle ---- */
const toggleBtn = $('#themeToggle');
function setTheme(theme){
  if(theme === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    if(toggleBtn) toggleBtn.textContent = '☀️';
    localStorage.setItem('sr_theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    if(toggleBtn) toggleBtn.textContent = '🌙';
    localStorage.setItem('sr_theme', 'light');
  }
}
const savedTheme = localStorage.getItem('sr_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
setTheme(savedTheme);

if(toggleBtn){
  toggleBtn.addEventListener('click', ()=>{
    const current = document.documentElement.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
  });
}

/* ---- background ---- */
(function(){
  const c = document.getElementById('bg');
  if(!c) return;
  const x = c.getContext('2d');
  let W, H, t = 0;
  function rs(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  addEventListener('resize', rs); rs();

  function wv(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const bgFill = isDark ? '#0f172a' : '#e9ecef';
    const primaryWave = isDark ? '#334155' : '#94a3b8';
    const accentWave = isDark ? '#ff5733' : '#e8422f';

    x.fillStyle = bgFill;
    x.fillRect(0, 0, W, H);

    for(let k = 0; k < 6; k++){
      x.beginPath();
      const amp = H * .05 + k * 10, yb = H * (.2 + k * .13);
      for(let px = 0; px <= W; px += 8){
        const e = Math.sin(px / W * Math.PI);
        const y = yb + Math.sin(px * .012 + t * .02 * (1 + k * .2) + k) * amp * e * (.5 + .5 * Math.sin(t * .01 + k * 2));
        px ? x.lineTo(px, y) : x.moveTo(px, y);
      }
      x.strokeStyle = (k == 2 ? accentWave : primaryWave) + (isDark ? '44' : '66');
      x.lineWidth = 1.3;
      x.stroke();
    }
  }

  let vis = true;
  document.addEventListener('visibilitychange', () => { vis = !document.hidden; });
  if(RM){ t = 40; wv(); return; }
  (function loop(){
    requestAnimationFrame(loop);
    if(!vis) return;
    t++;
    wv();
  })();
})();

/* ---- reveals + scroll ---- */
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.isIntersecting){
    e.target.classList.add('in');
    e.target.querySelectorAll('.stat-num').forEach(animNum);
    if(e.target.classList.contains('stat-num')) animNum(e.target);
    io.unobserve(e.target);
  }
})},{threshold:.12,rootMargin:'0px 0px -8% 0px'});
$$('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%6*.07)+'s';io.observe(el);});
/* Trigger hero stats right away */
setTimeout(()=>{$$('.hero-left .stat-num').forEach(animNum);},1000);
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('seen')}),{threshold:.02});
$$('.sec').forEach(s=>io2.observe(s));
const prog=$('#prog');
addEventListener('scroll',()=>{const h=document.body.scrollHeight-innerHeight;
prog.style.width=(h>0?scrollY/h*100:0)+'%';},{passive:true});
$$('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));
if(t){e.preventDefault();t.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});}}));
/* ---- parallax on 3D object + hero ---- */
const ob=$('.obj3d');
if(ob&&!RM){addEventListener('mousemove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
ob.style.transform='translateY(-50%) perspective(1000px) rotateY('+(x*22)+'deg) rotateX('+(-y*18)+'deg) translateZ(0)';},{passive:true});}
/* hero stays 100% visible always */
/* ---- nav scramble micro-interaction ---- */
const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&';
$$('.links a').forEach(a=>{const orig=a.textContent;let iv;
a.addEventListener('mouseenter',()=>{let f=0;clearInterval(iv);iv=setInterval(()=>{f++;
a.textContent=orig.split('').map((c,i)=>i<f/1.6?c:CH[(Math.random()*CH.length)|0]).join('');
if(f/1.6>orig.length){clearInterval(iv);a.textContent=orig;}},34);});
a.addEventListener('mouseleave',()=>{clearInterval(iv);a.textContent=orig;});});
const hr=$('#hudread');if(hr){setInterval(()=>{hr.textContent='SYS \u00b7 '+
['READY','SCAN','LINK OK','IDLE'][(Math.random()*4)|0];},1800);}

})();
</script>
</body>
</html>
